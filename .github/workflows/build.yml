name: Build Windows

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Prepare modules
        run: go mod tidy

      - name: Install resource compiler
        run: go install github.com/akavel/rsrc@latest

      - name: Embed icon and manifest
        shell: pwsh
        run: '& "$env:USERPROFILE\go\bin\rsrc.exe" -manifest app.manifest -ico assets\app.ico -o rsrc.syso'

      - name: Build
        run: go build -trimpath -ldflags="-s -w -H windowsgui" -o SimpleShare.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: SimpleShare-windows-amd64
          path: |
            SimpleShare.exe
            go.sum
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versionLine = Select-String -Path update.go -Pattern 'Version\s*=\s*"([^"]+)"'
          if (-not $versionLine) { throw 'Version not found in update.go' }
          $version = $versionLine.Matches[0].Groups[1].Value
          $tag = "v$version"
          gh release create $tag SimpleShare.exe --target $env:GITHUB_SHA --title "Simple Share (FTP/WebDAV) $tag" --notes "Simple Share (FTP/WebDAV) $tag`n`nWindows x64 release."
